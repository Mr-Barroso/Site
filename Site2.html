<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prefeitura Municipal</title>
    <style>
        /* Estilos globais */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-weight: bold;
            color: #333;
        }

        a {
            text-decoration: none;
            color: #337ab7;
        }

        a:hover {
            color: #23527c;
        }

        /* Estilos para o cabeçalho */
        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-between;
        }

        header nav ul li {
            margin-right: 20px;
        }

        header nav a {
            color: #fff;
        }

        /* Estilos para a seção de apresentação */
        #apresentacao {
            background-image: linear-gradient(to bottom, #333, #555);
            background-size: 100% 300px;
            background-position: 0% 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #apresentacao h1 {
            font-size: 48px;
        }

        #apresentacao p {
            font-size: 24px;
        }

        /* Estilos para a seção de serviços */
        #servicos {
            padding: 2em;
        }

        #servicos h2 {
            margin-top: 0;
        }

        #servicos ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #servicos li {
            margin-bottom: 20px;
        }

        #servicos h3 {
            margin-top: 0;
        }

        /* Estilos para a seção de notícias */
        #noticias {
            padding: 2em;
        }

        #noticias h2 {
            margin-top: 0;
        }

        #noticias ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #noticias li {
            margin-bottom: 20px;
        }

        #noticias h3 {
            margin-top: 0;
        }

        /* Estilos para a seção de contato */
        #contato {
            padding: 2em;
        }

        #contato h2 {
            margin-top: 0;
        }

        #contato form {
            margin-top: 20px;
        }

        #contato input,
        #contato textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }

        #contato button {
            background-color: #337ab7;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #contato button:hover {
            background-color: #23527c;
        }

        /* Estilos para o rodapé */
        footer {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
            clear: both;
        }
    </style>
</head>

<body>
    <!-- Cabeçalho -->
    <header>
        <nav>
            <ul>
                <li><a href="#apresentacao">Apresentação</a></li>
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#noticias">Notícias</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Seção de apresentação -->
    <section id="apresentacao">
        <h1>Prefeitura Municipal</h1>
        <p style="color: red;">Descrição da prefeitura e sua miss</p>
